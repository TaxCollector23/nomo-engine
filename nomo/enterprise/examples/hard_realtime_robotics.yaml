schema: nomo.enterprise/design-profile
version: 1
id: hard-realtime-robotics
name: Hard-real-time robotics deployment
description: A bounded profile for a safety-conscious robotics controller with a strict control period.

organization:
  id: example-robotics
  name: Example Robotics
  owner: autonomy-platform
project:
  id: rover-attitude-controller
  name: Rover attitude controller
  revision: "2026.10"

objectives:
  - name: end_to_end_latency
    direction: minimize
    target: 0.005
    unit: s
    priority: 1
  - name: task_accuracy
    direction: maximize
    target: 96.0
    unit: percent
    priority: 2
  - name: energy_per_inference
    direction: minimize
    target: 0.001
    unit: J
    priority: 3

constraints:
  latency_s_max: 0.005
  period_s: 0.01
  max_jitter_s: 0.0001
  accuracy_drop_max: 1.0
  memory_kb_max: 512

hardware:
  target: akd1500
  provenance: proxy
  assumptions:
    clock_hz:
      value: 300000000
      unit: Hz
      evidence: proxy
    static_power_mw:
      value: 50
      unit: mW
      evidence: proxy
    measurement_board:
      value: unavailable
      evidence: proxy

safety:
  policies:
    - fail_closed_on_measurement_gap
    - require_actuator_output_guard
    - forbid_unmeasured_wcet_claim
  required_guards:
    - actuator_torque_limit
    - thrust_limit
  fail_closed: true
  claim_policy: measured_only

precision:
  allowed_weight_bits: [8]
  allowed_activation_bits: [8, 16]
  allowed_accumulator_bits: [32, 64]
  allowed_domains: [continuous, symbolic]
  require_integer_runtime: true

required_evidence:
  - name: task_accuracy
    minimum: measured
    unit: percent
    description: Accuracy on the project-owned labeled holdout set.
  - name: end_to_end_latency
    minimum: measured
    unit: s
    description: Worst-case latency measured on the target deployment path.
  - name: energy_per_inference
    minimum: measured
    unit: J
    description: Energy per inference measured on the target board.
  - name: memory_footprint
    minimum: simulated
    unit: KB
    description: Static memory budget from the deployment artifact or simulator.

config:
  model: attitude_policy
  hardware: akd1500
  mode: hard_realtime
  budgets:
    accuracy_drop_max: 1.0
    period_s: 0.01
  search:
    population: 64
    rounds: 20
    seed: 17
  export:
    archive: tar.gz
    formats: [enterprise, design, c11, pdf]
