# Render blueprint: New > Blueprint > select this repo. Then set NOMO_CORS_ORIGINS to your
# Vercel URL and point the dashboard's NEXT_PUBLIC_NOMO_API at this service's URL.
services:
  - type: web
    name: nomo-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NOMO_CORS_ORIGINS
        value: "*"
      - key: NOMO_MAX_ACTIVE_RUNS
        value: "2"
