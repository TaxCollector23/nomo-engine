# Render Blueprint for the Nomo backend (free plan, Docker runtime).
# Existing service created by hand? Ignore this file and set the same env vars in the dashboard.
services:
  - type: web
    name: nomo-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NOMO_ADMIN_TOKEN          # password for /admin
        value: goatbergandrangoat
      - key: NOMO_CORS_ORIGINS         # your Vercel dashboard origin(s), comma-separated
        value: "*"
      - key: NOMO_MAX_ACTIVE_RUNS
        value: "2"
      - key: NOMO_MAX_POP
        value: "128"
      - key: NOMO_MAX_GENS
        value: "150"
      - key: NOMO_LOG_LEVEL
        value: INFO
